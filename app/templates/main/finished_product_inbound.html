{% extends "base.html" %}

{% block title %}成品入库{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0">
                <i class="fas fa-box me-2"></i>成品批量入库
            </h4>
            <div>
                <button type="button" class="btn btn-success me-2" onclick="addInboundRow()">
                    <i class="fas fa-plus"></i> 添加行
                </button>
                <a href="{{ url_for('main.manage_inventory') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> 返回库存管理
                </a>
            </div>
        </div>
        <div class="card-body">
            <form method="POST" id="batchInboundForm">
                {{ form.hidden_tag() }}
                
                <!-- 批量入库表格 -->
                <div class="table-responsive">
                    <table class="table table-bordered" id="inboundTable">
                        <thead class="table-light">
                            <tr>
                                <th width="120">产品编号 <span class="text-danger">*</span></th>
                                <th width="150">图号 <span class="text-danger">*</span></th>
                                <th width="120">型号 <span class="text-danger">*</span></th>
                                <th width="100">检验员 <span class="text-danger">*</span></th>
                                <th width="120">生产日期 <span class="text-danger">*</span></th>
                                <th width="100">数量 <span class="text-danger">*</span></th>
                                <th width="120">入库日期 <span class="text-danger">*</span></th>
                                <th width="150">备注</th>
                                <th width="80">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody">
                            <!-- 初始行 -->
                            <tr class="inbound-row" data-row="0">
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="product_number_0" placeholder="产品编号" required>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="drawing_number_0" placeholder="图号" required>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="model_0" placeholder="型号" required>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="inspector_0" placeholder="检验员" required>
                                </td>
                                <td>
                                    <input type="date" class="form-control form-control-sm" name="production_date_0" required>
                                </td>
                                <td>
                                    <input type="number" class="form-control form-control-sm" name="quantity_0" min="1" placeholder="数量" required>
                                </td>
                                <td>
                                    <input type="date" class="form-control form-control-sm" name="storage_date_0" required>
                                </td>
                                <td>
                                    <textarea class="form-control form-control-sm" name="notes_0" rows="1" placeholder="备注"></textarea>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-danger" onclick="removeInboundRow(0)" disabled>
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 批量操作按钮 -->
                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div>
                        <button type="button" class="btn btn-info me-2" onclick="fillCurrentDate()">
                            <i class="fas fa-calendar"></i> 填充今日日期
                        </button>
                        <button type="button" class="btn btn-warning me-2" onclick="clearAllRows()">
                            <i class="fas fa-broom"></i> 清空所有行
                        </button>
                        <span class="text-muted">共 <span id="rowCount">1</span> 行</span>
                    </div>
                    <div>
                        <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 批量入库
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let rowCounter = 0;

document.addEventListener('DOMContentLoaded', function() {
    fillCurrentDate();
    updateRowCount();
});

// 添加入库行
function addInboundRow() {
    rowCounter++;
    const tableBody = document.getElementById('inboundTableBody');
    const newRow = createInboundRow(rowCounter);
    tableBody.appendChild(newRow);
    updateRowCount();
    
    // 设置新行的默认日期
    const productionDateInput = newRow.querySelector(`input[name="production_date_${rowCounter}"]`);
    const storageDateInput = newRow.querySelector(`input[name="storage_date_${rowCounter}"]`);
    if (productionDateInput) {
        productionDateInput.valueAsDate = new Date();
    }
    if (storageDateInput) {
        storageDateInput.valueAsDate = new Date();
    }
}

// 创建入库行
function createInboundRow(rowIndex) {
    const row = document.createElement('tr');
    row.className = 'inbound-row';
    row.setAttribute('data-row', rowIndex);
    
    row.innerHTML = `
        <td>
            <input type="text" class="form-control form-control-sm" name="product_number_${rowIndex}" placeholder="产品编号" required>
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="drawing_number_${rowIndex}" placeholder="图号" required>
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="model_${rowIndex}" placeholder="型号" required>
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="inspector_${rowIndex}" placeholder="检验员" required>
        </td>
        <td>
            <input type="date" class="form-control form-control-sm" name="production_date_${rowIndex}" required>
        </td>
        <td>
            <input type="number" class="form-control form-control-sm" name="quantity_${rowIndex}" min="1" placeholder="数量" required>
        </td>
        <td>
            <input type="date" class="form-control form-control-sm" name="storage_date_${rowIndex}" required>
        </td>
        <td>
            <textarea class="form-control form-control-sm" name="notes_${rowIndex}" rows="1" placeholder="备注"></textarea>
        </td>
        <td>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeInboundRow(${rowIndex})">
                <i class="fas fa-trash"></i>
            </button>
        </td>
    `;
    
    return row;
}

// 删除入库行
function removeInboundRow(rowIndex) {
    const row = document.querySelector(`tr[data-row="${rowIndex}"]`);
    if (row) {
        row.remove();
        updateRowCount();
        updateDeleteButtons();
    }
}

// 更新行计数
function updateRowCount() {
    const rows = document.querySelectorAll('.inbound-row');
    document.getElementById('rowCount').textContent = rows.length;
    updateDeleteButtons();
}

// 更新删除按钮状态
function updateDeleteButtons() {
    const rows = document.querySelectorAll('.inbound-row');
    const deleteButtons = document.querySelectorAll('button[onclick*="removeInboundRow"]');
    
    deleteButtons.forEach(button => {
        button.disabled = rows.length <= 1;
    });
}

// 填充今日日期
function fillCurrentDate() {
    const today = new Date();
    const dateInputs = document.querySelectorAll('input[type="date"]');
    dateInputs.forEach(input => {
        if (!input.value) {
            input.valueAsDate = today;
        }
    });
}

// 清空所有行
function clearAllRows() {
    if (confirm('确定要清空所有行吗？')) {
        const tableBody = document.getElementById('inboundTableBody');
        // 保留第一行，清空其内容
        const firstRow = tableBody.querySelector('.inbound-row');
        if (firstRow) {
            const inputs = firstRow.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                input.value = '';
            });
        }
        
        // 删除其他行
        const otherRows = tableBody.querySelectorAll('.inbound-row:not(:first-child)');
        otherRows.forEach(row => row.remove());
        
        rowCounter = 0;
        updateRowCount();
        fillCurrentDate();
    }
}

// 重置表单
function resetForm() {
    if (confirm('确定要重置所有数据吗？')) {
        clearAllRows();
    }
}

// 表单验证和提交
document.getElementById('batchInboundForm').addEventListener('submit', function(e) {
    const rows = document.querySelectorAll('.inbound-row');
    let hasValidRows = false;
    let errors = [];
    
    rows.forEach((row, index) => {
        const rowIndex = row.getAttribute('data-row');
        
        const productNumber = row.querySelector(`input[name="product_number_${rowIndex}"]`).value.trim();
        const drawingNumber = row.querySelector(`input[name="drawing_number_${rowIndex}"]`).value.trim();
        const model = row.querySelector(`input[name="model_${rowIndex}"]`).value.trim();
        const inspector = row.querySelector(`input[name="inspector_${rowIndex}"]`).value.trim();
        const productionDate = row.querySelector(`input[name="production_date_${rowIndex}"]`).value;
        const quantity = parseInt(row.querySelector(`input[name="quantity_${rowIndex}"]`).value);
        const storageDate = row.querySelector(`input[name="storage_date_${rowIndex}"]`).value;
        
        if (!productNumber && !drawingNumber && !model && !inspector && !productionDate && !quantity && !storageDate) {
            return; // 空行跳过
        }
        
        if (!productNumber || !drawingNumber || !model || !inspector || !productionDate) {
            errors.push(`第 ${index + 1} 行：产品编号、图号、型号、检验员、生产日期不能为空`);
            return;
        }
        
        if (!quantity || quantity <= 0) {
            errors.push(`第 ${index + 1} 行：请输入有效的数量`);
            return;
        }
        
        if (!storageDate) {
            errors.push(`第 ${index + 1} 行：请选择入库日期`);
            return;
        }
        
        hasValidRows = true;
    });
    
    if (errors.length > 0) {
        e.preventDefault();
        alert('请修正以下错误：\n\n' + errors.join('\n'));
        return;
    }
    
    if (!hasValidRows) {
        e.preventDefault();
        alert('请至少添加一行有效的入库数据');
        return;
    }
});
</script>
{% endblock %}
