{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>{{ title }}</h2>
    
    <div class="card">
        <div class="card-body">
            <form method="POST" id="inventoryForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    {% if inventory_type == 'finished' %}
                    <!-- 成品表单字段 -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="product_number" class="form-label">产品编号</label>
                            <input type="text" class="form-control" id="product_number" name="product_number" required
                                   value="{{ item.product_number if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="production_date" class="form-label">生产日期</label>
                            <input type="date" class="form-control" id="production_date" name="production_date" required
                                   value="{{ item.production_date.strftime('%Y-%m-%d') if item and item.production_date else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="drawing_number" class="form-label">图号</label>
                            <input type="text" class="form-control" id="drawing_number" name="drawing_number" required
                                   value="{{ item.drawing_number if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="model" class="form-label">型号</label>
                            <input type="text" class="form-control" id="model" name="model" required
                                   value="{{ item.model if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="inspector" class="form-label">检验员</label>
                            <input type="text" class="form-control" id="inspector" name="inspector" required
                                   value="{{ item.inspector if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="status" class="form-label">状态</label>
                            <select class="form-control" id="status" name="status" required>
                                <option value="in_stock" {% if item and item.status == 'in_stock' %}selected{% endif %}>在库</option>
                                <option value="shipped" {% if item and item.status == 'shipped' %}selected{% endif %}>已发货</option>
                                <option value="scrapped" {% if item and item.status == 'scrapped' %}selected{% endif %}>报废</option>
                                <option value="used" {% if item and item.status == 'used' %}selected{% endif %}>已使用</option>
                            </select>
                        </div>
                    </div>
                    {% else %}
                    <!-- 原材料表单字段 -->
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="supplier" class="form-label">供应商</label>
                            <input type="text" class="form-control" id="supplier" name="supplier" required
                                   value="{{ item.supplier if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="material_name" class="form-label">品名</label>
                            <input type="text" class="form-control" id="material_name" name="material_name" required
                                   value="{{ item.material_name if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="melt_number" class="form-label">原料冶炼炉号</label>
                            <input type="text" class="form-control" id="melt_number" name="melt_number" required
                                   value="{{ item.melt_number if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="supplier_number" class="form-label">供应商编号</label>
                            <input type="text" class="form-control" id="supplier_number" name="supplier_number" required
                                   value="{{ item.supplier_number if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="storage_date" class="form-label">入库时间</label>
                            <input type="date" class="form-control" id="storage_date" name="storage_date" required
                                   value="{{ item.storage_date.strftime('%Y-%m-%d') if item and item.storage_date else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="quantity" class="form-label">数量</label>
                            <input type="number" step="0.01" class="form-control" id="quantity" name="quantity" required
                                   value="{{ item.quantity if item else '' }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="has_sample" name="has_sample"
                                       {% if item and item.has_sample %}checked{% endif %}>
                                <label class="form-check-label" for="has_sample">是否带样品</label>
                            </div>
                        </div>
                    </div>
                    {% endif %}
                    
                    <!-- 通用字段 -->
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="notes" class="form-label">备注</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3">{{ item.notes if item else '' }}</textarea>
                        </div>
                    </div>
                </div>
                
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{{ url_for('main.manage_inventory', type=inventory_type) }}" class="btn btn-secondary">返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // 表单验证
    $('#inventoryForm').submit(function(e) {
        var isValid = true;
        
        // 移除所有现有的错误提示
        $('.is-invalid').removeClass('is-invalid');
        $('.invalid-feedback').remove();
        
        // 验证必填字段
        $(this).find('[required]').each(function() {
            if (!$(this).val()) {
                isValid = false;
                $(this).addClass('is-invalid');
                $(this).after('<div class="invalid-feedback">此字段不能为空</div>');
            }
        });
        
        // 验证数字字段（如果存在）
        var quantity = $('#quantity');
        if (quantity.length && quantity.val()) {
            if (isNaN(quantity.val()) || parseFloat(quantity.val()) <= 0) {
                isValid = false;
                quantity.addClass('is-invalid');
                quantity.after('<div class="invalid-feedback">请输入有效的数量</div>');
            }
        }
        
        if (!isValid) {
            e.preventDefault();
        }
    });
});
</script>
{% endblock %}
