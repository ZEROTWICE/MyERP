{% extends "base.html" %}

{% block title %}质量管理{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>质量管理</h2>

    <!-- 统计卡片 -->
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">待处理质检任务</h5>
                    <p class="card-text display-4">{{ inspection_tasks_pending }}</p>
                    <a href="{{ url_for('main.quality_tasks', status='pending') }}" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">已完成质检任务</h5>
                    <p class="card-text display-4">{{ inspection_tasks_completed }}</p>
                    <a href="{{ url_for('main.quality_tasks', status='completed') }}" class="btn btn-success">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">质检模板</h5>
                    <p class="card-text display-4">{{ templates_count }}</p>
                    <a href="{{ url_for('main.quality_templates') }}" class="btn btn-info">管理模板</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 快捷操作 -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">快捷操作</h5>
                    <div class="btn-group" role="group">
                        <a href="{{ url_for('main.quality_tasks') }}" class="btn btn-outline-primary">
                            <i class="fas fa-tasks"></i> 质检任务
                        </a>
                        <a href="{{ url_for('main.quality_templates') }}" class="btn btn-outline-success">
                            <i class="fas fa-file-alt"></i> 质检模板
                        </a>
                        <a href="{{ url_for('main.quality_records') }}" class="btn btn-outline-info">
                            <i class="fas fa-history"></i> 质检记录
                        </a>
                        <a href="{{ url_for('main.manage_nonconformities') }}" class="btn btn-outline-danger">
                            <i class="fas fa-exclamation-triangle"></i> 不合格处置
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
