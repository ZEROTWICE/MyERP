{% extends "base.html" %}
{% block title %}供应商{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>供应商</h2>
    <form method="post" action="{{ url_for('main.save_supplier') }}" class="card card-body mb-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-2"><input class="form-control" name="code" placeholder="编码 *" required></div>
            <div class="col-md-3"><input class="form-control" name="name" placeholder="名称 *" required></div>
            <div class="col-md-2"><input class="form-control" name="contact" placeholder="联系人"></div>
            <div class="col-md-2"><input class="form-control" name="phone" placeholder="电话"></div>
            <div class="col-md-2">
                <select class="form-select" name="is_active"><option value="1">启用</option><option value="0">停用</option></select>
            </div>
            <div class="col-md-1"><button class="btn btn-primary">保存</button></div>
        </div>
    </form>
    <table class="table table-hover">
        <thead><tr><th>编码</th><th>名称</th><th>联系人</th><th>电话</th><th>状态</th></tr></thead>
        <tbody>
        {% for s in items %}
            <tr>
                <td><code>{{ s.code }}</code></td>
                <td>{{ s.name }}</td>
                <td>{{ s.contact or '-' }}</td>
                <td>{{ s.phone or '-' }}</td>
                <td>{% if s.is_active %}启用{% else %}停用{% endif %}</td>
            </tr>
        {% else %}
            <tr><td colspan="5" class="text-muted">暂无供应商</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
