{% extends "base.html" %}

{% block title %}原材料入库{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="card-title mb-0">
                <i class="fas fa-industry me-2"></i>原材料批量入库
            </h4>
            <div>
                <button type="button" class="btn btn-success me-2" onclick="addInboundRow()">
                    <i class="fas fa-plus"></i> 添加行
                </button>
                <a href="{{ url_for('main.manage_inventory') }}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> 返回库存管理
                </a>
            </div>
        </div>
        <div class="card-body">
            <form method="POST" id="batchInboundForm">
                {{ form.hidden_tag() }}
                
                <!-- 批量入库表格 -->
                <div class="table-responsive">
                    <table class="table table-bordered" id="inboundTable">
                        <thead class="table-light">
                            <tr>
                                <th width="150">供应商 <span class="text-danger">*</span></th>
                                <th width="150">原材料品类 <span class="text-danger">*</span></th>
                                <th width="120">原料冶炼炉号</th>
                                <th width="120">供应商编号 <span class="text-danger">*</span></th>
                                <th width="120">内部编号</th>
                                <th width="100">数量 <span class="text-danger">*</span></th>
                                <th width="120">入库日期 <span class="text-danger">*</span></th>
                                <th width="80">带样品</th>
                                <th width="150">备注</th>
                                <th width="80">操作</th>
                            </tr>
                        </thead>
                        <tbody id="inboundTableBody">
                            <!-- 初始行 -->
                            <tr class="inbound-row" data-row="0">
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="supplier_0" placeholder="供应商" required>
                                </td>
                                <td>
                                    <select class="form-control form-control-sm" name="category_id_0" required>
                                        <option value="">选择原材料品类</option>
                                        <!-- 品类选项会通过JavaScript动态加载 -->
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="melt_number_0" placeholder="原料冶炼炉号">
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="supplier_number_0" placeholder="供应商编号" required>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" name="internal_number_0" placeholder="留空自动生成">
                                </td>
                                <td>
                                    <input type="number" class="form-control form-control-sm" name="quantity_0" min="0.01" step="0.01" placeholder="数量" required>
                                </td>
                                <td>
                                    <input type="date" class="form-control form-control-sm" name="storage_date_0" required>
                                </td>
                                <td>
                                    <div class="form-check form-check-sm d-flex justify-content-center">
                                        <input type="checkbox" class="form-check-input" name="has_sample_0">
                                    </div>
                                </td>
                                <td>
                                    <textarea class="form-control form-control-sm" name="notes_0" rows="1" placeholder="备注"></textarea>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-danger" onclick="removeInboundRow(0)" disabled>
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- 批量操作按钮 -->
                <div class="mt-3 d-flex justify-content-between align-items-center">
                    <div>
                        <button type="button" class="btn btn-info me-2" onclick="fillCurrentDate()">
                            <i class="fas fa-calendar"></i> 填充今日日期
                        </button>
                        <button type="button" class="btn btn-warning me-2" onclick="clearAllRows()">
                            <i class="fas fa-broom"></i> 清空所有行
                        </button>
                        <span class="text-muted">共 <span id="rowCount">1</span> 行</span>
                    </div>
                    <div>
                        <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">
                            <i class="fas fa-undo"></i> 重置
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 批量入库
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let rowCounter = 0;
let categories = [];

document.addEventListener('DOMContentLoaded', function() {
    loadCategories();
    fillCurrentDate();
    updateRowCount();
});

// 加载品类数据
function loadCategories() {
    fetch('/api/raw-material-categories')
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            categories = [{id: '', name: '选择原材料品类'}];
            categories = categories.concat(data.data);
        } else {
            console.log('获取品类失败:', data.message);
            categories = [{id: '', name: '选择原材料品类'}];
        }
        populateCategorySelects();
    })
    .catch(error => {
        console.log('加载品类失败:', error);
        // 设置默认品类
        categories = [{id: '', name: '选择原材料品类'}];
        populateCategorySelects();
    });
}

// 填充品类选择框
function populateCategorySelects() {
    const selects = document.querySelectorAll('select[name*="category_id"]');
    selects.forEach(select => {
        select.innerHTML = '';
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.name;
            select.appendChild(option);
        });
    });
}

// 添加入库行
function addInboundRow() {
    rowCounter++;
    const tableBody = document.getElementById('inboundTableBody');
    const newRow = createInboundRow(rowCounter);
    tableBody.appendChild(newRow);
    
    // 为新行的品类选择框填充选项
    const categorySelect = newRow.querySelector(`select[name="category_id_${rowCounter}"]`);
    if (categorySelect) {
        categorySelect.innerHTML = '';
        categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.name;
            categorySelect.appendChild(option);
        });
    }
    
    updateRowCount();
    
    // 设置新行的默认日期
    const dateInput = newRow.querySelector(`input[name="storage_date_${rowCounter}"]`);
    if (dateInput) {
        dateInput.valueAsDate = new Date();
    }
}

// 创建入库行
function createInboundRow(rowIndex) {
    const row = document.createElement('tr');
    row.className = 'inbound-row';
    row.setAttribute('data-row', rowIndex);
    
    row.innerHTML = `
        <td>
            <input type="text" class="form-control form-control-sm" name="supplier_${rowIndex}" placeholder="供应商" required>
        </td>
        <td>
            <select class="form-control form-control-sm" name="category_id_${rowIndex}" required>
                <option value="">选择原材料品类</option>
                <!-- 品类选项会通过JavaScript动态填充 -->
            </select>
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="melt_number_${rowIndex}" placeholder="原料冶炼炉号">
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="supplier_number_${rowIndex}" placeholder="供应商编号" required>
        </td>
        <td>
            <input type="text" class="form-control form-control-sm" name="internal_number_${rowIndex}" placeholder="留空自动生成">
        </td>
        <td>
            <input type="number" class="form-control form-control-sm" name="quantity_${rowIndex}" min="0.01" step="0.01" placeholder="数量" required>
        </td>
        <td>
            <input type="date" class="form-control form-control-sm" name="storage_date_${rowIndex}" required>
        </td>
        <td>
            <div class="form-check form-check-sm d-flex justify-content-center">
                <input type="checkbox" class="form-check-input" name="has_sample_${rowIndex}">
            </div>
        </td>
        <td>
            <textarea class="form-control form-control-sm" name="notes_${rowIndex}" rows="1" placeholder="备注"></textarea>
        </td>
        <td>
            <button type="button" class="btn btn-sm btn-danger" onclick="removeInboundRow(${rowIndex})">
                <i class="fas fa-trash"></i>
            </button>
        </td>
    `;
    
    return row;
}

// 删除入库行
function removeInboundRow(rowIndex) {
    const row = document.querySelector(`tr[data-row="${rowIndex}"]`);
    if (row) {
        row.remove();
        updateRowCount();
        updateDeleteButtons();
    }
}

// 更新行计数
function updateRowCount() {
    const rows = document.querySelectorAll('.inbound-row');
    document.getElementById('rowCount').textContent = rows.length;
    updateDeleteButtons();
}

// 更新删除按钮状态
function updateDeleteButtons() {
    const rows = document.querySelectorAll('.inbound-row');
    const deleteButtons = document.querySelectorAll('button[onclick*="removeInboundRow"]');
    
    deleteButtons.forEach(button => {
        button.disabled = rows.length <= 1;
    });
}

// 填充今日日期
function fillCurrentDate() {
    const today = new Date();
    const dateInputs = document.querySelectorAll('input[type="date"]');
    dateInputs.forEach(input => {
        if (!input.value) {
            input.valueAsDate = today;
        }
    });
}

// 清空所有行
function clearAllRows() {
    if (confirm('确定要清空所有行吗？')) {
        const tableBody = document.getElementById('inboundTableBody');
        // 保留第一行，清空其内容
        const firstRow = tableBody.querySelector('.inbound-row');
        if (firstRow) {
            const inputs = firstRow.querySelectorAll('input, textarea');
            inputs.forEach(input => {
                if (input.type === 'checkbox') {
                    input.checked = false;
                } else {
                    input.value = '';
                }
            });
        }
        
        // 删除其他行
        const otherRows = tableBody.querySelectorAll('.inbound-row:not(:first-child)');
        otherRows.forEach(row => row.remove());
        
        rowCounter = 0;
        updateRowCount();
        fillCurrentDate();
    }
}

// 重置表单
function resetForm() {
    if (confirm('确定要重置所有数据吗？')) {
        clearAllRows();
    }
}

// 表单验证和提交
document.getElementById('batchInboundForm').addEventListener('submit', function(e) {
    const rows = document.querySelectorAll('.inbound-row');
    let hasValidRows = false;
    let errors = [];
    
    rows.forEach((row, index) => {
        const rowIndex = row.getAttribute('data-row');
        
        const supplier = row.querySelector(`input[name="supplier_${rowIndex}"]`).value.trim();
        const categoryId = row.querySelector(`select[name="category_id_${rowIndex}"]`).value;
        const supplierNumber = row.querySelector(`input[name="supplier_number_${rowIndex}"]`).value.trim();
        const quantity = parseFloat(row.querySelector(`input[name="quantity_${rowIndex}"]`).value);
        const storageDate = row.querySelector(`input[name="storage_date_${rowIndex}"]`).value;
        
        if (!supplier && !categoryId && !supplierNumber && !quantity && !storageDate) {
            return; // 空行跳过
        }
        
        if (!supplier || !categoryId || !supplierNumber) {
            errors.push(`第 ${index + 1} 行：供应商、原材料品类、供应商编号不能为空`);
            return;
        }
        
        if (!quantity || quantity <= 0) {
            errors.push(`第 ${index + 1} 行：请输入有效的数量`);
            return;
        }
        
        if (!storageDate) {
            errors.push(`第 ${index + 1} 行：请选择入库日期`);
            return;
        }
        
        hasValidRows = true;
    });
    
    if (errors.length > 0) {
        e.preventDefault();
        alert('请修正以下错误：\n\n' + errors.join('\n'));
        return;
    }
    
    if (!hasValidRows) {
        e.preventDefault();
        alert('请至少添加一行有效的入库数据');
        return;
    }
});
</script>
{% endblock %}
