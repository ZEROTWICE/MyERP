# 仅构建并推送到 Docker Hub 私有仓库，不部署到服务器。
# 需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
#
# 触发与职责：
#   push → main        ：gate（report-only 门禁）+ build-and-push（构筑并推送 :latest / :<sha>）
#   pull_request → main：gate + build-check（**只构筑，push: false**，不推送任何 tag）
#   workflow_dispatch  ：手动触发，走与 push 相同的路径
#   ⇒ 「每次 push 前先证明 Dockerfile 可被 GH Actions 构筑」由 PR 上的 build-check 保证。
name: Docker publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容。推送镜像用的是 Docker Hub Secrets，不需要 GITHUB_TOKEN 的写权限。
permissions:
  contents: read

# 同一 ref 上重复触发排队而非互相取消；不 cancel-in-progress，避免推送中途被打断。
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: zerotwice/myerp

jobs:
  # ---------------------------------------------------------------- E-04 门禁
  # 第一阶段（当前）：report-only —— continue-on-error: true，且 build-and-push **不** needs 本 job（不阻塞发布）
  # 第二阶段（A-63 第二步，观测 1 轮全绿后）：① 删掉 continue-on-error；② 在 build-and-push 下加 `needs: gate`
  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # E-04 门禁的前置条件：门禁入口 `ci_gates.py` 依赖真实业务库 app.db 才能启动（见本步 summary）。
      # 缺库时**整条入口跳过**并把「未执行」写进日志/summary —— 不伪装成「跑绿」。
      - name: 预检：真实库 app.db 是否在位（决定 E-04 门禁本次能否执行）
        id: preflight
        run: |
          echo "REPO_ROOT（检出根，$GITHUB_WORKSPACE）= $(pwd)"
          echo "受跟踪的 app.db 条目数 = $(git ls-files app.db | wc -l)（0 = 被 .gitignore 排除，检出里不会有）"
          if [ -f app.db ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "app.db 在位 ⇒ E-04 门禁按 CI 等价入口执行"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E-04 门禁本次未在 CI 执行（NOT EXECUTED）：真实库 app.db 不在版本控制内，检出里不存在"
            cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## E-04 门禁：本次未执行（NOT EXECUTED）—— 不是「执行并通过」

          本 job 的检出里没有 `app.db`，因此 **E-04 门禁（CI 等价入口）本次没有被执行**。
          配置级 lint（E-04-c / E-04-d，即 `ci_lint.py`）不受影响，仍然照跑并独立判红。

          ### 为什么缺库就跑不了（结构性，不是配置问题）
          - `test-reports-2026-10/harness/_env.py:47`：`REAL_DB = os.path.join(REPO_ROOT, 'app.db')`；
          - `_env.py:267`（通用子进程包装 `run_child`）在**每个子步骤**前后无条件 `sha256_file(REAL_DB)`（落点是 `_env.py:177` 的 `open()`）⇒ 缺库即 `FileNotFoundError`；
          - 该调用点在 `ci_gates.py:1134`，即**任何**一步（含纯静态的 `check_templates`）都会同样崩 ⇒ 无法靠「跳过某一步」规避，只能整条入口跳过；
          - 同类依赖：`scripts/_test_bootstrap.py:25` 的 `shutil.copy2(ROOT/'app.db', …)`（functional_test / permission_matrix / smoke_test 用）；
          - `app.db`（2531328 B 真实业务库）被 `.gitignore:21` 的 `/app.db` 排除 ⇒ 干净检出里**必然**不存在。
          MD
          fi

      - name: 门禁入口存在性检查（测试资产是否已纳入版本控制）
        run: |
          if [ ! -f test-reports-2026-10/harness/ci_gates.py ]; then
            echo "::warning::E-04 门禁入口缺失：需先把 test-reports-2026-10/harness/** 纳入版本控制（见 test-reports-2026-10/23-E04门禁进CI.md §9）"
            exit 3
          fi

      # 缺库时整条入口跳过（判定见上一步 preflight）：绝不在没有真实库的 runner 上跑 ⇒ 也就不会崩在 FileNotFoundError。
      # 跳过是「未执行」而非「执行并通过」，日志与 job summary 都如实标注。
      - name: E-04 门禁（CI 等价入口）
        if: steps.preflight.outputs.present == 'true'
        run: |
          python -B test-reports-2026-10/harness/ci_gates.py \
            --phase first \
            --json test-reports-2026-10/evidence/harness/ci-gh-${{ github.run_id }}/ci_gates.json

      - name: 校验 CI 配置本身（E-04-c/E-04-d）
        if: always()
        run: python -B test-reports-2026-10/harness/ci_lint.py --phase first

      - name: 上传门禁 JSON（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gates-json
          path: test-reports-2026-10/evidence/harness/ci-gh-*/ci_gates.json
          if-no-files-found: warn

  build-and-push:
    # 第二阶段：在此加 `needs: gate`（当前不加 ⇒ gate 不阻塞发布）
    # 只处理 push / 手动触发；PR 走下面的 build-check（只构筑），避免 PR 覆盖 :latest。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- PR 构筑校验
  # 与 build-and-push 的唯一区别：push: false —— 只证明 Dockerfile 能在 GH Actions 上构筑成功。
  # 两个 job 的 if 条件互斥（PR vs 非 PR），故不会同时运行。
  # tag 用 pr-<sha> 仅为本地标识，不会被推送。
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构筑校验（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
