# 仅构建并推送到 Docker Hub 私有仓库，不部署到服务器。
# 需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
#
# 触发与职责：
#   push → main        ：gate（report-only 门禁）+ build-and-push（构筑并推送 :latest / :<sha>）
#   pull_request → main：gate + build-check（**只构筑，push: false**，不推送任何 tag）
#   workflow_dispatch  ：手动触发，走与 push 相同的路径
#   ⇒ 「每次 push 前先证明 Dockerfile 可被 GH Actions 构筑」由 PR 上的 build-check 保证。
name: Docker publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容。推送镜像用的是 Docker Hub Secrets，不需要 GITHUB_TOKEN 的写权限。
permissions:
  contents: read

# 同一 ref 上重复触发排队而非互相取消；不 cancel-in-progress，避免推送中途被打断。
concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: zerotwice/myerp

jobs:
  # ---------------------------------------------------------------- E-04 门禁
  # 第一阶段（当前）：report-only —— continue-on-error: true，且 build-and-push **不** needs 本 job（不阻塞发布）
  # 第二阶段（A-63 第二步，观测 1 轮全绿后）：① 删掉 continue-on-error；② 在 build-and-push 下加 `needs: gate`
  gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: 门禁入口存在性检查（测试资产是否已纳入版本控制）
        run: |
          if [ ! -f test-reports-2026-10/harness/ci_gates.py ]; then
            echo "::warning::E-04 门禁入口缺失：需先把 test-reports-2026-10/harness/** 纳入版本控制（见 test-reports-2026-10/23-E04门禁进CI.md §9）"
            exit 3
          fi

      - name: E-04 门禁（CI 等价入口）
        run: |
          python -B test-reports-2026-10/harness/ci_gates.py \
            --phase first \
            --json test-reports-2026-10/evidence/harness/ci-gh-${{ github.run_id }}/ci_gates.json

      - name: 校验 CI 配置本身（E-04-c/E-04-d）
        if: always()
        run: python -B test-reports-2026-10/harness/ci_lint.py --phase first

      - name: 上传门禁 JSON（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gates-json
          path: test-reports-2026-10/evidence/harness/ci-gh-*/ci_gates.json
          if-no-files-found: warn

  build-and-push:
    # 第二阶段：在此加 `needs: gate`（当前不加 ⇒ gate 不阻塞发布）
    # 只处理 push / 手动触发；PR 走下面的 build-check（只构筑），避免 PR 覆盖 :latest。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- PR 构筑校验
  # 与 build-and-push 的唯一区别：push: false —— 只证明 Dockerfile 能在 GH Actions 上构筑成功。
  # 两个 job 的 if 条件互斥（PR vs 非 PR），故不会同时运行。
  # tag 用 pr-<sha> 仅为本地标识，不会被推送。
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构筑校验（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
