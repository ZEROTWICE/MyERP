services:
  db:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_USERNAME: myerp
      POSTGRESQL_PASSWORD: myerp
      POSTGRESQL_DATABASE: myerp
      POSTGRESQL_POSTGRES_PASSWORD: postgres
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replicator
    volumes:
      - pgdata:/bitnami/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myerp -d myerp"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-replica:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_USERNAME: myerp
      POSTGRESQL_PASSWORD: myerp
      POSTGRESQL_DATABASE: myerp
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: db
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: replicator
    volumes:
      - pgdata_replica:/bitnami/postgresql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5433:5432"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://myerp:myerp@db:5432/myerp
      SITE_CODE: ${SITE_CODE:-F1}
      SECRET_KEY: ${SECRET_KEY:-change-me}
    volumes:
      - ./uploads:/app/uploads
      # 空库首次启动时的初始数据来源。镜像不含 *.db（见 .dockerignore），
      # 所以走挂载；宿主机文件不存在会被 Docker 建成目录，那样自举直接跳过。
      - ./app.db:/app/seed.db:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_replica:
