# Windows部署配置文件
deployment:
  app_name: "wage_management_system"
  app_port: 5000
  
  # 部署路径配置
  paths:
    deploy_root: "C:\\Apps\\wage_management_system"
    backup_root: "C:\\Apps\\backups\\wage_management_system"
    logs_path: "C:\\Apps\\logs\\wage_management_system"
    
  # Python环境配置
  python:
    use_conda: true
    conda_env_name: "wage"
    conda_executable: "conda"  # 或指定完整路径如: "C:\\Users\\%USERNAME%\\anaconda3\\Scripts\\conda.exe"
    
  # 数据库配置
  database:
    type: "sqlite"
    file_name: "app.db"
    backup_retention_days: 7
    
  # 服务配置
  service:
    name: "WageManagementSystem"
    display_name: "工资管理系统服务"
    description: "工资管理系统Flask应用服务"
    use_windows_service: true  # 是否使用Windows服务方式运行
    
  # 环境变量
  environment:
    FLASK_ENV: "production"
    SECRET_KEY: "your-production-secret-key-here"
    DATABASE_URL: "sqlite:///app.db"
    
  # 健康检查配置
  health_check:
    endpoint: "/"
    timeout_seconds: 30
    max_retries: 5
    retry_interval_seconds: 10
    
  # 备份配置
  backup:
    enabled: true
    retention_days: 30
    include_uploads: true
    
  # 通知配置
  notifications:
    email:
      enabled: false
      smtp_server: "smtp.company.com"
      smtp_port: 587
      username: "deploy@company.com"
      recipients:
        - "admin@company.com"
        - "dev@company.com"
    
    # Webhook通知（如钉钉、企业微信等）
    webhook:
      enabled: false
      url: "https://hooks.example.com/webhook"
      
  # 代码质量检查
  quality_checks:
    enabled: true
    python_syntax: true
    # flake8: true
    # pylint: true
    
  # 性能优化
  performance:
    enable_gzip: true
    static_file_caching: true
    
  # 安全配置
  security:
    csrf_protection: true
    secure_headers: true
    
# Jenkins特定配置
jenkins:
  agent_label: "windows"
  workspace_cleanup: true
  archive_artifacts: false
  
  # 构建触发器
  triggers:
    git_polling: "H/5 * * * *"  # 每5分钟检查一次代码变化
    
  # 并行执行
  parallel_stages: false 